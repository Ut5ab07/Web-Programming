<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Hobbit</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="right-frame">
    <div id="book-container">
        <div class="book-header">
            <h2 id="book-title">The Hobbit</h2>
            <div class="book-image">
                <img src="images/hobbit.jpg" alt="The Hobbit Book Poster">
            </div>
            <div class="book-metadata">
                <p><strong>Author:</strong> J.R.R. Tolkien</p>
                <p><strong>Publication Year:</strong> 1937</p>
                <p><strong>Publisher:</strong> George Allen & Unwin</p>
                <p><strong>Genre:</strong> Fantasy</p>
                <p><strong>Pages:</strong> 310</p>
            </div>
        </div>
        <div class="book-description">
            <p>Bilbo Baggins embarks on an unexpected adventure with dwarves to reclaim treasure guarded by a dragon.</p>
        </div>
    </div>
</body>
</html>
