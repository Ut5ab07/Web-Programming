<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Murder on the Orient Express</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="right-frame">

        <div class="book-header">
            <h2 id="book-title">Murder on the Orient Express</h2>

                <p><strong>Author:</strong> Agatha Christie</p>
                <p><strong>Publication Year:</strong> 1934</p>
