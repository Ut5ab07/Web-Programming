<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dune</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="right-frame">
    <div id="book-container">
        <div class="book-header">
            <h2 id="book-title">Dune</h2>
            <div class="book-image">
                <img src="images/dune.jpg" alt="Dune Book Poster">
            </div>
            <div class="book-metadata">
                <p><strong>Author:</strong> Frank Herbert</p>
                <p><strong>Publication Year:</strong> 1965</p>
                <p><strong>Publisher:</strong> Chilton Books</p>
                <p><strong>Genre:</strong> Science Fiction</p>
                <p><strong>Pages:</strong> 688</p>
            </div>
        </div>
        <div class="book-description">
            <p>An epic space opera featuring politics, ecology, and mysticism on the desert planet Arrakis, following young Paul Atreides.</p>
        </div>
    </div>
</body>
</html>
